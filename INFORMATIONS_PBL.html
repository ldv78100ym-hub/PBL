                },
                'MOTO_DRONE_SEANCE_3.html': {
                    type: 'Séance 3',
                    description: '💻 Programmation d’un drone (simulateur) : boucles, capteurs, régulation PID. Les élèves écrivent du code pour stabiliser le vol. Un apprentissage par l’action qui rend la programmation concrète et motivante.'
                },
                'MOTO_DRONE_SEANCE_4.html': {
                    type: 'Séance 4',
                    description: '🏍️ Conception de la partie « moto » : châssis, roues, moteur, direction. Les élèves abordent la mécanique, la transmission et l’électronique de puissance. Un projet de technologie pure qui complète la partie aérienne.'
                },
                'MOTO_DRONE_SEANCE_5.html': {
                    type: 'Séance 5',
                    description: '🔗 Fusion des systèmes : commande mixte (vol + sol). Programmation des transitions automatiques. Les élèves résolvent des problèmes complexes (communication entre composants, gestion des priorités). Un vrai défi d’ingénierie !'
                },
                'MOTO_DRONE_SEANCE_6.html': {
                    type: 'Séance 6',
                    description: '🎬 Finalisation et démonstration : tests, réglages, optimisation. Chaque groupe présente son prototype et ses performances. Un moment de fierté et de partage qui clôture le projet en beauté.'
                },
                'MOTO_DRONE_BAREME.html': {
                    type: 'Barème',
                    description: '📊 Grille d’évaluation : conception, programmation, performance du système, travail en équipe, présentation. Une évaluation encourageante qui met en avant les compétences techniques et transversales.'
                },
                'MOTO_DRONE_PRESENTATION.html': {
                    type: 'Présentation',
                    description: '📽️ Présentation du projet Moto‑Drone pour informer l’équipe pédagogique et les parents. Montre l’ancrage disciplinaire, les partenariats possibles et les retombées sur l’orientation des élèves.'
                },
                'MOTO_DRONE_OUTILS.html': {
                    type: 'Outils',
                    description: '🛠️ Liste des ressources : simulateurs de vol, environnements Arduino/Python, logiciels de CAO. Des tutoriels et des liens pour prendre en main chaque outil rapidement. Un gain de temps considérable pour l’enseignant.'
                },
                'MOTO_DRONE_V0.html': {
                    type: 'Version initiale',
                    description: '📝 Ébauche du projet : premières idées, choix technologiques, maquette 3D. Document de travail qui témoigne de la démarche de conception et peut servir de base pour d’autres adaptations.'
                },
                'MOTO_DRONE_COMMUNICATION_PREPARATOIRE.html': {
                    type: 'Communication',
                    description: '📬 Lettre d’information aux familles : présentation du projet, du matériel nécessaire, du calendrier. Permet d’impliquer les parents et de créer une dynamique positive autour du projet.'
                }
            };

            // ----- ÉLÉMENTS DOM -----
            const grid = document.getElementById('docGrid');
            const searchInput = document.getElementById('searchInput');
            const tabBtns = document.querySelectorAll('.tab-btn');
            const currentFolderSpan = document.getElementById('currentFolder');
            const projectPresentationDiv = document.getElementById('projectPresentation');

            const badgeARC = document.getElementById('badgeARC');
            const badgeAVION = document.getElementById('badgeAVION');
            const badgeMOTO = document.getElementById('badgeMOTO');

            let allDocs = [];
            let currentTab = 'ARC'; // par défaut, pas de "Tous"

            // ----- GÉNÉRATION D'UN RÉSUMÉ (avec fallback) -----
            function getSummary(name, folder) {
                if (SUMMARY_MAP[name]) {
                    return SUMMARY_MAP[name];
                }
                // Résumé générique incitatif
                let s = name.replace(/\.html$/i, '').replace(/\.pdf$/i, '').replace(/_/g, ' ');
                const prefixes = ['ARC ', 'AVION PAPIER ', 'MOTO DRONE '];
                for (const p of prefixes) {
                    if (s.toUpperCase().startsWith(p)) {
                        s = s.slice(p.length);
                        break;
                    }
                }
                const lower = s.toLowerCase();
                let type = 'Document';
                let desc = `Découvrez ce document du projet ${folder}. Il apporte des éclairages et des méthodes pour mener à bien votre projet en classe. N’hésitez pas à l’adapter à vos élèves !`;
                if (lower.includes('sommaire')) {
                    type = 'Sommaire';
                    desc = `Structure et organisation du projet ${folder}. Un guide pour vous repérer et planifier les séances.`;
                } else if (lower.includes('seance') || lower.includes('séance')) {
                    type = 'Séance';
                    const num = s.match(/\d+/);
                    const n = num ? num[0] : '';
                    desc = `Séance ${n} : activités, objectifs et supports pour faire progresser vos élèves dans le projet ${folder}.`;
                } else if (lower.includes('bareme') || lower.includes('barème')) {
                    type = 'Barème';
                    desc = `Grille d’évaluation pour le projet ${folder}. Un outil clair et transparent pour valoriser les compétences de vos élèves.`;
                } else if (lower.includes('presentation')) {
                    type = 'Présentation';
                    desc = `Présentation du projet ${folder} : diaporama clé en main pour informer et convaincre.`;
                } else if (lower.includes('outils')) {
                    type = 'Outils';
                    desc = `Ressources et logiciels pour le projet ${folder}. Gagnez du temps et facilitez la prise en main par vos élèves.`;
                } else if (lower.includes('v0')) {
                    type = 'Version initiale';
                    desc = `Première version du projet ${folder} : un document de travail pour nourrir votre réflexion.`;
                } else if (lower.includes('communication preparatoire')) {
                    type = 'Communication';
                    desc = `Lettre aux familles pour présenter le projet ${folder} et susciter l’engagement de tous.`;
                } else if (lower.includes('equation differentielle')) {
                    type = 'Ressource';
                    desc = `Fiche sur les équations différentielles : un soutien théorique pour vos élèves.`;
                } else if (lower.includes('exemple calcul')) {
                    type = 'Exemple';
                    desc = `Exemple de calcul commenté pour guider vos élèves dans leur démarche.`;
                } else {
                    desc = `Document du projet ${folder} : une ressource supplémentaire pour enrichir votre enseignement par projet.`;
                }
                return { type, description: desc };
            }

            function formatSize(bytes) {
                if (bytes === undefined || bytes === null) return '—';
                if (bytes < 1024) return bytes + ' o';
                if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' Ko';
                return (bytes / 1048576).toFixed(1) + ' Mo';
            }

            // ----- RÉCUPÉRATION VIA L'API -----
            async function fetchDocuments() {
                try {
                    const results = await Promise.all(
                        REPOS.map(async (repo) => {
                            const url = GITHUB_API_BASE + repo.folder;
                            const resp = await fetch(url);
                            if (!resp.ok) {
                                throw new Error(`HTTP ${resp.status} — ${resp.statusText}`);
                            }
                            const data = await resp.json();
                            return data
                                .filter(item => item.type === 'file')
                                .map(item => ({
                                    folder: repo.folder,
                                    label: repo.label,
                                    name: item.name,
                                    size: item.size,
                                    html_url: BASE_URL + repo.folder + '/' + item.name,
                                }));
                        })
                    );
                    return results.flat();
                } catch (err) {
                    console.error('Erreur lors de la récupération des documents:', err);
                    throw err;
                }
            }

            // ----- AFFICHAGE DE LA PRÉSENTATION -----
            function renderPresentation(folder) {
                const pres = PRESENTATIONS[folder];
                if (!pres) {
                    projectPresentationDiv.innerHTML = '';
                    return;
                }
                const tagsHtml = pres.tags.map(t => `<span>${t}</span>`).join('');
                projectPresentationDiv.innerHTML = `
                    <h2>${pres.title}</h2>
                    <div class="subtitle">${pres.subtitle}</div>
                    <div class="desc">${pres.description}</div>
                    <div class="tags">${tagsHtml}</div>
                `;
            }

            // ----- FILTRAGE ET RENDU (uniquement pour le projet actif) -----
            function filterAndRender() {
                const query = searchInput.value.toLowerCase().trim();

                // Filtrer les documents du projet courant
                let docs = allDocs.filter(d => d.folder === currentTab);

                if (query) {
                    docs = docs.filter(d => {
                        const summary = getSummary(d.name, d.folder);
                        return d.name.toLowerCase().includes(query) ||
                            d.label.toLowerCase().includes(query) ||
                            summary.type.toLowerCase().includes(query) ||
                            summary.description.toLowerCase().includes(query);
                    });
                }

                render(docs);

                // Mettre à jour le fil d'ariane
                const tabLabel = REPOS.find(r => r.folder === currentTab)?.label || currentTab;
                currentFolderSpan.textContent = tabLabel;

                // Mettre à jour les badges
                updateBadges();
            }

            function render(docs) {
                if (!docs || docs.length === 0) {
                    grid.innerHTML = `
                        <div class="status">
                            <div style="font-size:2rem; margin-bottom:0.5rem;">🔍</div>
                            <div>Aucun document ne correspond à votre sélection.</div>
                            <div style="font-size:0.9rem; color:#94a3b8; margin-top:0.5rem;">Essayez de modifier votre recherche ou choisissez un autre projet.</div>
                        </div>
                    `;
                    return;
                }

                let html = '';
                for (const doc of docs) {
                    const summary = getSummary(doc.name, doc.folder);
                    const safeName = doc.name.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const safeType = summary.type.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const safeDesc = summary.description.replace(/</g, '&lt;').replace(/>/g, '&gt;');

                    html += `
                        <div class="doc-card" data-folder="${doc.folder}">
                            <span class="folder">${doc.label}</span>
                            <div class="doc-name">
                                <a href="${doc.html_url}" target="_blank" rel="noopener">${safeName}</a>
                            </div>
                            <div class="summary">
                                <span class="doc-type">${safeType}</span>
                                <span class="desc">${safeDesc}</span>
                            </div>
                            <div class="meta">
                                <span class="size">${formatSize(doc.size)}</span>
                                <a href="${doc.html_url}" target="_blank" rel="noopener" class="link-icon">
                                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                                        <polyline points="15 3 21 3 21 9" />
                                        <line x1="10" y1="14" x2="21" y2="3" />
                                    </svg>
                                    Ouvrir
                                </a>
                            </div>
                        </div>
                    `;
                }
                grid.innerHTML = html;
            }

            function updateBadges() {
                const arc = allDocs.filter(d => d.folder === 'ARC').length;
                const avion = allDocs.filter(d => d.folder === 'AVION_PAPIER').length;
                const moto = allDocs.filter(d => d.folder === 'MOTO_DRONE').length;
                badgeARC.textContent = arc;
                badgeAVION.textContent = avion;
                badgeMOTO.textContent = moto;
            }

            // ----- CHANGEMENT D'ONGLET -----
            function setTab(tabId) {
                currentTab = tabId;
                tabBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.tab === tabId);
                });
                renderPresentation(tabId);
                // Réinitialiser la recherche ? On garde le texte mais on refiltre
                filterAndRender();
            }

            // ----- INITIALISATION -----
            async function init() {
                grid.innerHTML = `
                    <div class="status">
                        <div class="spinner"></div>
                        <div>Chargement des documents…</div>
                    </div>
                `;

                try {
                    allDocs = await fetchDocuments();
                    allDocs.sort((a, b) => {
                        if (a.folder !== b.folder) return a.folder.localeCompare(b.folder);
                        return a.name.localeCompare(b.name);
                    });

                    updateBadges();
                    // Activer le premier onglet (ARC) par défaut
                    const defaultTab = 'ARC';
                    // S'assurer que le bouton ARC est actif
                    tabBtns.forEach(btn => {
                        btn.classList.toggle('active', btn.dataset.tab === defaultTab);
                    });
                    renderPresentation(defaultTab);
                    currentTab = defaultTab;
                    filterAndRender();

                    if (searchInput.value.trim()) {
                        filterAndRender();
                    }
                } catch (err) {
                    grid.innerHTML = `
                        <div class="status">
                            <div class="error-icon">⚠️</div>
                            <div style="font-weight:600; color:#b91c1c;">Impossible de charger les documents</div>
                            <div style="font-size:0.9rem; color:#64748b; margin-top:0.5rem;">${err.message}</div>
                            <div style="font-size:0.85rem; color:#94a3b8; margin-top:0.3rem;">
                                Vérifiez votre connexion ou que les dépôts sont accessibles.
                            </div>
                        </div>
                    `;
                }
            }

            // ----- CANVAS (particules) -----
            function initCanvas() {
                const canvas = document.getElementById('bgCanvas');
                const ctx = canvas.getContext('2d');
                let w, h;
                let particles = [];
                const COUNT = 50;
                const MAX_SPEED = 0.2;

                function resize() {
                    w = canvas.width = window.innerWidth;
                    h = canvas.height = window.innerHeight;
                }

                function createParticles() {
                    particles = [];
                    for (let i = 0; i < COUNT; i++) {
                        particles.push({
                            x: Math.random() * w,
                            y: Math.random() * h,
                            vx: (Math.random() - 0.5) * MAX_SPEED * 2,
                            vy: (Math.random() - 0.5) * MAX_SPEED * 2,
                            r: 1.5 + Math.random() * 2.5,
                            a: 0.10 + Math.random() * 0.15
                        });
                    }
                }

                function draw() {
                    ctx.clearRect(0, 0, w, h);

                    for (const p of particles) {
                        p.x += p.vx;
                        p.y += p.vy;

                        if (p.x < 0 || p.x > w) p.vx *= -1;
                        if (p.y < 0 || p.y > h) p.vy *= -1;

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(59, 130, 246, ${p.a})`;
                        ctx.fill();
                    }

                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 120) {
                                const alpha = (1 - dist / 120) * 0.08;
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle = `rgba(59, 130, 246, ${alpha})`;
                                ctx.lineWidth = 0.5;
                                ctx.stroke();
                            }
                        }
                    }

                    requestAnimationFrame(draw);
                }

                window.addEventListener('resize', () => {
                    resize();
                    createParticles();
                });

                resize();
                createParticles();
                draw();
            }

            // ----- ÉVÉNEMENTS -----
            tabBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    setTab(this.dataset.tab);
                });
            });

            let debounceTimer;
            searchInput.addEventListener('input', function() {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    filterAndRender();
                }, 200);
            });

            // ----- LANCEMENT -----
            init();
            initCanvas();

        })();
    </script>

</body>
